; astromech_server: ESP32 implementation. The boards have no network
; connectivity; a master (e.g. a Raspberry Pi) drives each over USB serial.
; See docs/PROTOCOL.md and sdk/python.
;
;   pio run                      build both firmwares
;   pio run -e droid -t upload   droid controller board (one droid per board)
;   pio run -e beacon -t upload  keep-awake beacon board
;
; libastromech is consumed from the sibling checkout (../../libastromech/esp32).

[platformio]
default_envs = droid, beacon

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
; Per-env version from version/<env>.txt (see scripts/version.py).
extra_scripts =
  pre:scripts/version.py
  post:scripts/flash_info.py
build_flags = -Isrc/common -Isrc/droid -std=gnu++17 -Wall -Wextra
lib_deps =
  h2zero/NimBLE-Arduino@~2.5.2
  bblanchon/ArduinoJson@^7.0.0
  symlink://../../libastromech/esp32

[env:droid]
build_src_filter = -<*> +<common/> +<droid/>
build_flags = ${env.build_flags} -DFIRMWARE_ROLE=\"droid\"

[env:beacon]
build_src_filter = -<*> +<common/> +<beacon/>
build_flags = ${env.build_flags} -DFIRMWARE_ROLE=\"beacon\"
