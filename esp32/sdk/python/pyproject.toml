[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astromech-boards"
version = "0.1.0"
description = "Python SDK for the astromech ESP32 droid-controller and beacon boards (USB serial)."
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
